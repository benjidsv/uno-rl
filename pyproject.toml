[project]
name = "uno-v5"
version = "0.1.0"
description = "UNO engine, exact solvers and evaluators: measure skill vs luck before RL"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "triton-windows>=3.8.0.post28; sys_platform == 'win32'",  # Linux CUDA torch pulls in triton itself; none on macOS
]

[project.scripts]
uno = "uno.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "uno"
module-root = ""

# Windows -> CUDA PyTorch
# macOS -> normal PyPI PyTorch
[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: spawns processes or compiles a tree; keep these few (tests/rl/test_parallel.py)",
]
