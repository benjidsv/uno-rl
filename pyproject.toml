[project]
name = "uno-v5"
version = "0.1.0"
description = "UNO engine, exact solvers and evaluators: measure skill vs luck before RL"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]

[project.scripts]
uno = "uno.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "uno"
module-root = ""

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
